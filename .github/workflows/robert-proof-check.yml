name: Robert proof companion
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selected-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: robert-review-2026-10-07
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: robert-review-2026-10-07/lean
          auto-config: "false"
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
      - name: Check exact selected axiom coverage
        run: python3 scripts/check_selected_axioms.py
        working-directory: robert-review-2026-10-07
      - name: Preserve actual selected output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: actual-selected-axiom-output
          path: |
            robert-review-2026-10-07/proofs/live-selected-axiom-output.txt
            robert-review-2026-10-07/proofs/live-selected-verification.json
