name = "openmath"
defaultTargets = ["ReviewExisting", "ReviewAdditions"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.style.copyright.formalConjectures = false
weak.linter.style.namespace = true
weak.linter.style.stubs = true
weak.linter.style.openClassical = true

[[require]]
name = "formal_conjectures"
git = "https://github.com/google-deepmind/formal-conjectures"
rev = "137aec5c7abd3aa61f7a73138a97279acfc79e93"

[[lean_lib]]
name = "Openmath"

[[lean_lib]]
name = "ReviewExisting"

[[lean_lib]]
name = "ReviewAdditions"

[[lean_lib]]
name = "VerifiedAdditions"
roots = ["AffinePaletteBarrier", "BernoulliColumnSample", "BernoulliDegree", "BernoulliGram", "BernoulliOperatorSample", "BinomialMode", "BipartiteFactor", "CapacityHall", "CherryBoundary", "ComponentClosure", "ComponentUnions", "CrossingLoss", "CutResilience", "CycleComposition", "DeletedGadget", "EdgeCounts", "FactorExtraction", "FiniteProductProbability", "GlobalSelectors", "GraphCuts", "HaarComponents", "HaarInfinite", "HamiltonianDeletion", "InfiniteAffinePaletteBarrier", "LemmaF", "Main", "MatchingIdentification", "MatrixSampling", "MatrixVarianceBounds", "MultigraphCut", "NearRegularCriterion", "NearRegularScalars", "NormVariance", "PartitionTransport", "Passage", "Piece", "PrescribedVertex", "PrimeChart", "Projection", "R1", "RegularCentering", "Regularity", "ReindexSampling", "SampledColumnEnergy", "SamplingNumerics", "SkeletonB", "SkeletonK", "SpectralCentering", "SpectralRankOne", "Substitution", "TwinDensityExtension", "UniformConditioning", "UniformDegree", "UniformOperatorSample", "UnitPorts"]

[[lean_lib]]
name = "SLT"
roots = ["SLT.MatrixInfra.Basic", "SLT.MatrixInfra.CourantFischer", "SLT.MatrixInfra.MatCalc", "SLT.RMT.Lieb", "SLT.RMT.MatBern"]

[[lean_lib]]
name = "IndependentTransversals"
roots = ["IndependentTransversals.AugmentingSequences", "IndependentTransversals.Basic", "IndependentTransversals.GeneralHaxell", "IndependentTransversals.MainDefs", "IndependentTransversals.WeakHypergraph"]
